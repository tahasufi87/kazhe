<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منوی کافه</title>
<meta name="theme-color" content="#2B1E16">
<style>
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --soft:#F3ECE3; --border:#E8DFD4;
  --text:#2B1E16; --muted:#7A6A5D; --accent:#A0612F; --accent-soft:#F6E9DC;
  --dark:#2B1E16; --green:#3F8A5F; --green-soft:#E6F2EA; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#17120F;--surface:#211A15;--soft:#2A221C;--border:rgba(255,255,255,.12);
  --text:#FFF;--muted:rgba(255,255,255,.65);--accent:#E0A06A;--accent-soft:rgba(224,160,106,.12);
  --green:#72BC8F;--green-soft:rgba(114,188,143,.12)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{font-family:Vazirmatn,"Noto Sans Arabic",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Hero */
.hero{background:radial-gradient(120% 90% at 85% 0%,#6B4428 0%,#2B1E16 60%);color:#FFF;padding:40px 0 64px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;background:#F6E9DC;display:grid;place-items:center}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.3px}
.hero p{color:rgba(255,255,255,.72);font-size:15px;margin-top:4px}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.chip.open::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#72BC8F;margin-left:6px}

/* Search */
.search{margin-top:-28px;position:relative;z-index:2}
.search label{position:relative;display:block}
.search input{width:100%;height:52px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;padding:0 48px 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 12px;margin-top:8px;border-bottom:1px solid var(--border)}
.tabs .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px;max-width:720px;margin:0 auto}
.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;padding:10px 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.tab .ic{font-size:22px;line-height:1}
.tab[aria-selected="true"]{background:var(--dark);border-color:var(--dark);color:#FFF}
@media (prefers-color-scheme: dark){.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#17120F}}
.tab:focus-visible,.item:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Sections */
section.cat{padding-top:32px;scroll-margin-top:110px}
section.cat h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
section.cat h2 small{font-size:14px;font-weight:400;color:var(--muted)}
.list{display:grid;gap:12px}
.item{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;text-align:right;font:inherit;color:inherit;width:100%;transition:.15s}
.item:hover{border-color:var(--accent)}
.thumb{flex:0 0 88px;height:88px;border-radius:8px;display:grid;place-items:center;font-size:40px}
.info{flex:1;display:flex;flex-direction:column;min-width:0}
.info h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info p{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bottom{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;font-size:16px}
.price span{font-weight:400;font-size:14px;color:var(--muted);margin-right:4px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.new{background:var(--green-soft);color:var(--green)}
.soldout{opacity:.55}
.soldout .price{text-decoration:line-through}
.empty{text-align:center;color:var(--muted);padding:48px 0;display:none}

/* Footer */
footer{margin:48px 0 0;padding:32px 0 48px;border-top:1px solid var(--border);color:var(--muted);font-size:14px;text-align:center}
footer .links{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);color:var(--text);text-decoration:none;background:var(--surface)}

/* Modal */
.sheet{position:fixed;inset:0;background:rgba(20,14,10,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:24px;animation:up .2s ease}
@media(min-width:640px){.sheet{align-items:center}.panel{border-radius:16px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.panel .big{height:180px;border-radius:12px;display:grid;place-items:center;font-size:84px;margin-bottom:16px}
.panel h3{font-size:22px;font-weight:800}
.panel p{color:var(--muted);margin-top:8px}
.panel .bottom{padding-top:16px}
.close{min-height:44px;padding:0 24px;border-radius:8px;border:0;background:var(--dark);color:#FFF;font:inherit;cursor:pointer}
@media (prefers-color-scheme: dark){.close{background:var(--accent);color:#17120F}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B4428" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg>
    </div>
    <h1 id="cafeName">کافه آیین</h1>
    <p id="cafeTagline">قهوه تخصصی، کیک خانگی، حال خوب</p>
    <div class="meta">
      <span class="chip open">باز است · ۸ صبح تا ۱۲ شب</span>
      <span class="chip">قیمت‌ها به تومان</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="search">
    <label>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="جستجو در منو… مثلاً لاته" aria-label="جستجو در منو">
    </label>
  </div>
</main>

<nav class="tabs" aria-label="دسته‌بندی‌ها"><div class="row" id="tabs" role="tablist"></div></nav>

<main class="wrap" id="menu"></main>
<div class="wrap"><div class="empty" id="empty">موردی پیدا نشد ☕</div></div>

<footer>
  <div class="wrap">
    <div class="links">
      <a href="tel:02100000000">📞 تماس</a>
      <a href="https://instagram.com/" target="_blank" rel="noopener">📷 اینستاگرام</a>
      <a href="https://maps.google.com/" target="_blank" rel="noopener">📍 مسیریابی</a>
    </div>
    <div>تهران، خیابان ولیعصر، کوچه نمونه، پلاک ۱۲</div>
    <div style="margin-top:4px">۹٪ ارزش افزوده به صورتحساب اضافه می‌شود</div>
  </div>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="panel">
    <div class="big" id="mImg"></div>
    <h3 id="mTitle"></h3>
    <p id="mDesc"></p>
    <div class="bottom"><div class="price" id="mPrice"></div><button class="close" id="mClose">بستن</button></div>
  </div>
</div>

<script>
/* ====== منوی کافه را از اینجا ویرایش کنید ======
   price: قیمت به تومان | tag: "popular" یا "new" | soldout: true برای ناموجود
   img: می‌توانید به‌جای ایموجی آدرس عکس بگذارید، مثل "images/latte.jpg" */
const MENU = [
  {id:"hot", title:"بار گرم (بر پایه اسپرسو)", icon:"☕", color:"#F3E4D4", items:[
    {name:"اسپرسو سینگل", desc:"", price:null, img:"☕"},
    {name:"اسپرسو دبل", desc:"", price:null, img:"☕"},
    {name:"لته", desc:"", price:null, img:"🥛"},
    {name:"کاپوچینو", desc:"", price:null, img:"☕"},
    {name:"موکا", desc:"", price:null, img:"☕"},
    {name:"ماکیاتو", desc:"", price:null, img:"☕"},
    {name:"هات چاکلت", desc:"", price:null, img:"🍫"},
    {name:"آمریکانو", desc:"", price:null, img:"☕"},
    {name:"ماسالا", desc:"", price:null, img:"🍵"},
    {name:"نسکافه", desc:"", price:null, img:"☕"},
    {name:"وایت چاکلت", desc:"", price:null, img:"🍫"},
    {name:"شیر دارچین", desc:"", price:null, img:"🥛"},
    {name:"هات پسته", desc:"", price:null, img:"🥜"},
  ]},
  {id:"cold", title:"نوشیدنی سرد", icon:"🧊", color:"#E1EEF3", items:[
    {name:"آیس آمریکانو", desc:"اسپرسو دوبل روی یخ", price:105000, img:"🧊"},
    {name:"آیس لاته", desc:"اسپرسو، شیر سرد و یخ", price:135000, img:"🥤", tag:"popular"},
    {name:"کلد برو", desc:"دم‌آوری ۱۸ ساعته با آب سرد", price:150000, img:"🫙"},
    {name:"لیموناد نعنا", desc:"لیموی تازه، نعنا و سودا", price:110000, img:"🍋"},
  ]},
  {id:"shake", title:"شیک و اسموتی", icon:"🥤", color:"#F6E3EA", items:[
    {name:"شیک شکلات", desc:"بستنی وانیل، شکلات بلژیکی", price:165000, img:"🍫"},
    {name:"شیک نوتلا", desc:"نوتلا، بستنی و شیر", price:185000, img:"🥤", tag:"popular"},
    {name:"اسموتی توت‌فرنگی", desc:"توت‌فرنگی، موز و ماست", price:155000, img:"🍓"},
    {name:"اسموتی انبه", desc:"انبه، آناناس و آب پرتقال", price:160000, img:"🥭", soldout:true},
  ]},
  {id:"tea", title:"چای و دمنوش", icon:"🍵", color:"#E6F0E2", items:[
    {name:"چای ایرانی", desc:"قوری دو نفره با نبات", price:80000, img:"🫖"},
    {name:"چای ماسالا", desc:"چای سیاه، شیر و ادویه‌های گرم", price:115000, img:"🍵", tag:"new"},
    {name:"دمنوش به‌لیمو", desc:"به‌لیمو، بادرنجبویه و عسل", price:90000, img:"🌿"},
  ]},
  {id:"cake", title:"کیک و دسر", icon:"🍰", color:"#F7ECD9", items:[
    {name:"چیزکیک نیویورکی", desc:"با سس توت‌فرنگی", price:145000, img:"🍰", tag:"popular"},
    {name:"کیک شکلاتی", desc:"خیس، با گاناش شکلات تلخ", price:135000, img:"🎂"},
    {name:"تیرامیسو", desc:"ماسکارپونه، اسپرسو و کاکائو", price:150000, img:"🍮"},
    {name:"کروسان کره‌ای", desc:"تازه، هر روز صبح", price:95000, img:"🥐"},
  ]},
  {id:"food", title:"صبحانه و غذا", icon:"🍳", color:"#F5E9DA", items:[
    {name:"صبحانه کامل", desc:"تخم‌مرغ، پنیر، کره، مربا، نان تازه و چای", price:240000, img:"🍳"},
    {name:"املت", desc:"گوجه، تخم‌مرغ محلی، نان سنگک", price:160000, img:"🍳"},
    {name:"ساندویچ مرغ پستو", desc:"نان چاباتا، مرغ گریل، پستو و پنیر", price:260000, img:"🥪", tag:"new"},
    {name:"پاستا آلفردو", desc:"پنه، مرغ، قارچ و سس خامه", price:290000, img:"🍝"},
  ]},
];

const fa = n => n.toLocaleString("fa-IR");
const priceHtml = p => p==null ? "" : `${fa(p)}<span>تومان</span>`;
const isImg = s => /\.(png|jpe?g|webp|gif|svg)$|^https?:|^data:/.test(s);
const media = (it,c) => isImg(it.img) ? `<img src="${it.img}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : it.img;
const badge = it => it.soldout ? `<span class="badge" style="background:var(--soft);color:var(--muted)">ناموجود</span>`
  : it.tag==="popular" ? `<span class="badge">محبوب</span>` : it.tag==="new" ? `<span class="badge new">جدید</span>` : "";

const menuEl = document.getElementById("menu"), tabsEl = document.getElementById("tabs");
MENU.forEach((c,ci)=>{
  tabsEl.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" aria-selected="${ci===0}" data-id="${c.id}"><span class="ic">${c.icon}</span>${c.title}</button>`);
  menuEl.insertAdjacentHTML("beforeend",`<section class="cat" id="${c.id}"><h2>${c.icon} ${c.title} <small>${fa(c.items.length)} مورد</small></h2><div class="list">${
    c.items.map((it,ii)=>`<button class="item${it.soldout?" soldout":""}" data-c="${ci}" data-i="${ii}" data-s="${(it.name+" "+it.desc).toLowerCase()}">
      <div class="thumb" style="background:${c.color}">${media(it)}</div>
      <div class="info"><h3>${it.name} ${badge(it)}</h3>${it.desc?`<p>${it.desc}</p>`:""}
      <div class="bottom"><div class="price">${priceHtml(it.price)}</div></div></div></button>`).join("")
  }</div></section>`);
});

// tab click → scroll
tabsEl.addEventListener("click",e=>{const t=e.target.closest(".tab"); if(!t) return;
  document.getElementById(t.dataset.id).scrollIntoView({behavior:"smooth"}); setActive(t.dataset.id);});
function setActive(id){tabsEl.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.id===id;t.setAttribute("aria-selected",on);
  if(on) t.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});});}
// scroll spy
const obs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&setActive(e.target.id)),{rootMargin:"-120px 0px -65% 0px"});
document.querySelectorAll("section.cat").forEach(s=>obs.observe(s));

// search
document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase(); let any=false;
  document.querySelectorAll("section.cat").forEach(s=>{let n=0;
    s.querySelectorAll(".item").forEach(it=>{const ok=!q||it.dataset.s.includes(q); it.style.display=ok?"":"none"; if(ok)n++;});
    s.style.display=n?"":"none"; if(n)any=true;});
  document.getElementById("empty").style.display=any?"none":"block";});

// modal
const sheet=document.getElementById("sheet");
menuEl.addEventListener("click",e=>{const b=e.target.closest(".item"); if(!b) return;
  const c=MENU[b.dataset.c], it=c.items[b.dataset.i];
  const m=document.getElementById("mImg"); m.style.background=c.color; m.innerHTML=media(it);
  document.getElementById("mTitle").innerHTML=it.name+" "+badge(it);
  document.getElementById("mDesc").textContent=it.desc;
  document.getElementById("mPrice").innerHTML=priceHtml(it.price);
  sheet.classList.add("show"); document.getElementById("mClose").focus();});
const close=()=>sheet.classList.remove("show");
document.getElementById("mClose").onclick=close;
sheet.addEventListener("click",e=>{if(e.target===sheet)close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
</script>
</body>
</html>
